name: Legacy GitHub Pages rollback (manual only)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Existing static-site rollback branch or commit'
        required: true
        default: 'backup/pre-cloudflare-2026-09-28'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24

      - name: Build static site
        run: pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
